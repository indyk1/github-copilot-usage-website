name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI never needs to write to the repository or call Azure.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CopilotUsage.sln

      - name: Build (warnings are errors)
        run: dotnet build CopilotUsage.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test CopilotUsage.sln --configuration Release --no-build
